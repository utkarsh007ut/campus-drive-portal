<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Company Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
<div class="navbar">
    <h2>🎓 Company Dashboard</h2>
    <div><span id="welcomeMsg"></span><button class="btn-danger" onclick="logout()">Log Out</button></div>
</div>

<div class="dashboard-container">
    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('propose')">Propose Drive</button>
        <button class="tab-btn" onclick="showTab('drives')">My Drives</button>
        <button class="tab-btn" onclick="showTab('applications')">Applications</button>
    </div>

    <div id="tab-propose" class="tab-panel">
        <div class="form-panel">
            <h3>Propose a Campus Drive</h3>
            <input type="number" id="collegeId" placeholder="College ID">
            <input type="text" id="requirements" placeholder="Requirements (e.g. CGPA 7+, Java, SQL)">
            <button class="btn-primary" onclick="proposeDrive()">Send Request</button>
        </div>
    </div>

    <div id="tab-drives" class="tab-panel hidden"><div id="drivesList" class="list"></div></div>
    <div id="tab-applications" class="tab-panel hidden"><div id="appsList" class="list"></div></div>
</div>

<script src="js/api.js"></script>
<script src="js/company-dashboard.js"></script>
</body>
</html>
