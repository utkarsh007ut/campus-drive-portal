<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Company Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
<div class="navbar">
    <h2>🎓 Company Dashboard</h2>
    <div><span id="welcomeMsg"></span><button class="btn-danger" onclick="logout()">Log Out</button></div>
</div>

<div class="dashboard-container">
    <div class="tabs">
        <button class="tab-btn active" data-tab="propose" onclick="showTab('propose')">Propose Drive</button>
        <button class="tab-btn" data-tab="drives" onclick="showTab('drives')">My Drives</button>
        <button class="tab-btn" data-tab="applications" onclick="showTab('applications')">Applications</button>
    </div>

    <div id="tab-propose" class="tab-panel">
        <div class="form-panel" style="max-width:600px;">
            <h3>Propose a Campus Drive</h3>
            <div>
                <label style="font-size:13px; font-weight:600; color:var(--text-muted); display:block; margin-bottom:8px;">
                    Select Colleges (Ctrl/Cmd + Click for multiple)
                </label>
                <select id="collegeSelect" multiple size="6"></select>
            </div>
            <textarea id="requirements" placeholder="Requirements (e.g. CGPA 7+, Java, SQL)" rows="3"></textarea>
            <button class="btn-primary" onclick="proposeDrive()">Send Request to Selected Colleges</button>
        </div>
    </div>

    <div id="tab-drives" class="tab-panel hidden">
        <div id="collegeFilterBar" class="tabs" style="margin-bottom:16px;"></div>
        <div id="drivesList" class="list"></div>
    </div>

    <div id="tab-applications" class="tab-panel hidden">
        <div id="appsList" class="list"></div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/company-dashboard.js"></script>
</body>
</html>
