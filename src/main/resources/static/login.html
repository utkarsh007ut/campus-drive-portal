<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Campus Drive Portal</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-page">
<div class="auth-card">
    <div class="auth-icon">🎓</div>
    <h1 id="loginTitle">Log In</h1>

    <div class="tabs" style="margin-bottom:18px;">
        <button type="button" class="tab-btn active" onclick="selectRole('Admin')">Admin</button>
        <button type="button" class="tab-btn" onclick="selectRole('College')">College</button>
        <button type="button" class="tab-btn" onclick="selectRole('Company')">Company</button>
        <button type="button" class="tab-btn" onclick="selectRole('Student')">Student</button>
    </div>

    <form id="loginForm">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit" class="btn-primary" style="width:100%">Log In</button>
    </form>

    <div id="message" class="message"></div>
    <div style="margin-top:16px; font-size:13px;"><a href="register.html">New College or Company? Register</a></div>
</div>

<script src="js/api.js"></script>
<script src="js/login.js"></script>
</body>
</html>
